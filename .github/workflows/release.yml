name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.2.0, without -SNAPSHOT)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  VERSIONS_PLUGIN: org.codehaus.mojo:versions-maven-plugin:2.18.0
  MVN: mvn --batch-mode --no-transfer-progress

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must look like 1.2.3 (no -SNAPSHOT suffix), got '$VERSION'" >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # RELEASE_TOKEN (PAT or GitHub App token allowed to bypass the main
          # branch protection) is required if main is protected; falls back to
          # the default GITHUB_TOKEN otherwise.
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - name: Check tag does not exist
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "Tag $VERSION already exists" >&2
            exit 1
          fi

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # conventions has an independent version and is excluded from versioning.
      - name: Set release version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          $MVN "$VERSIONS_PLUGIN:set" -DnewVersion="$VERSION" -DgenerateBackupPoms=false -pl '!conventions'

      - name: Build and test
        run: $MVN clean install

      - name: Commit and tag release
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git commit -am "Release $VERSION"
          git tag -a "$VERSION" -m "Release $VERSION"

      - name: Set next snapshot version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          $MVN "$VERSIONS_PLUGIN:set" -DnewVersion="$VERSION-SNAPSHOT" -DgenerateBackupPoms=false -pl '!conventions'
          git commit -am "Prepare for next development iteration ($VERSION-SNAPSHOT)"

      - name: Push commits and tag
        env:
          VERSION: ${{ inputs.version }}
        run: git push --atomic origin "HEAD:${GITHUB_REF_NAME}" "refs/tags/$VERSION"
