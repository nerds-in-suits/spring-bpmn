# Local settings of the demo application; every value can be overridden on the command line (--name=value).
server:
  port: 8080

spring:
  application:
    name: spring-bpmn-demo
  datasource:
    # File database below the working directory: survives restarts, deleted by "mvn clean" when started via the scripts.
    url: jdbc:h2:file:./bpmn-db
    username: sa
    password: ""
  jpa:
    hibernate:
      # The modules bring no DDL scripts; Hibernate creates and updates their tables.
      ddl-auto: update
    open-in-view: false
  bpmn:
    rest:
      # Allows deploying BPMN files with POST /api/bpmn/v1/process-definitions.
      deployment-enabled: true
      security:
        # The authorities of the users in DemoUsers: viewer has BPMN_READ, admin has all.
        authority:
          read-definitions: BPMN_READ
          read-instances: BPMN_READ
          deploy: BPMN_DEPLOY
          start-instance: BPMN_START
          update-variables: BPMN_VARIABLES
          complete-user-task: BPMN_TASK
  tasks:
    pool-size: 4

logging:
  file:
    # Log file below the working directory; rolled over as configured under logging.logback.rollingpolicy.
    name: ./demo.log
  logback:
    rollingpolicy:
      # Rolls demo.log over daily and whenever it reaches max-file-size into gzipped archives next to it.
      file-name-pattern: "${logging.file.name}.%d{yyyy-MM-dd}.%i.gz"
      max-file-size: 10MB
      # Keeps the archives of the last 7 days, at most total-size-cap together.
      max-history: 7
      total-size-cap: 100MB
  level:
    de.nemeses: DEBUG
  threshold:
    # The console shows INFO and above, the log file everything down to DEBUG.
    console: INFO
    file: DEBUG
  pattern:
    # Console and file log pattern; [%mdc] shows all MDC entries of the logging thread.
    console: "%date{ISO8601} [%-5p][%t][%c][%mdc] %msg %n"
    file: "%date{ISO8601} [%-5p][%t][%c][%mdc] %msg %n"
